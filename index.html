<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <h1 id="Header">There are 0 days until Christmas.</h1>
    <label id="LangLabel" for="LangSelect">Language</label>
    <select id="LangSelect">
    </select>
    <label id="PickerLabel" for="BgPicker">Background Image</label>
    <input type="file" id="BgPicker" accept="image/*">
    <script>
    const translations = {
        en: (days) => `There are ${days} days until Christmas.`,
        es: (days) => `Faltan ${days} días para Navidad.`,
        fr: (days) => `Il reste ${days} jours avant Noël.`,
        de: (days) => `Es sind noch ${days} Tage bis Weihnachten.`,
        it: (days) => `Mancano ${days} giorni a Natale.`,
        pt: (days) => `Faltam ${days} dias para o Natal.`,
        nl: (days) => `Het is nog ${days} dagen tot Kerstmis.`,
        pl: (days) => `Do świąt Bożego Narodzenia zostało ${days} dni.`,
        ru: (days) => `До Рождества осталось ${days} дней.`,
        uk: (days) => `До Різдва залишилося ${days} днів.`,
        sv: (days) => `Det är ${days} dagar kvar till jul.`,
        no: (days) => `Det er ${days} dager igjen til jul.`,
        da: (days) => `Der er ${days} dage til jul.`,
        fi: (days) => `Jouluun on ${days} päivää.`,
        cs: (days) => `Do Vánoc zbývá ${days} dní.`,
        sk: (days) => `Do Vianoc zostáva ${days} dní.`,
        hu: (days) => `${days} nap van hátra karácsonyig.`,
        ro: (days) => `Mai sunt ${days} zile până la Crăciun.`,
        el: (days) => `Απομένουν ${days} ημέρες μέχρι τα Χριστούγεννα.`,
        tr: (days) => `Noel'e ${days} gün kaldı.`,
        ja: (days) => `クリスマスまであと${days}日です。`,
        zh: (days) => `距离圣诞节还有 ${days} 天。`,
        ko: (days) => `크리스마스까지 ${days}일 남았습니다.`,
        vi: (days) => `Còn ${days} ngày nữa là đến Giáng sinh.`,
        id: (days) => `Ada ${days} hari lagi sampai Natal.`,
        ms: (days) => `Terdapat ${days} hari lagi sebelum Krismas.`,
        th: (days) => `เหลืออีก ${days} วันจะถึงวันคริสต์มาส`,
        ar: (days) => `يوجد ${days} يوماً حتى عيد الميلاد.`,
        hi: (days) => `क्रिसमस में ${days} दिन बाकी हैं।`,
        fa: (days) => `${days} روز تا کریسمس باقی مانده است.`,
        jp: (days) => `クリスマスまであと ${days} 日です。`
    };

    var currentLang = 'en';

    const selector = document.getElementById("LangSelect");
    Object.keys(translations).forEach(code => {
    const option = document.createElement("option");
    option.value = code;
    option.textContent = translations[code].name;
    selector.appendChild(option);
    });

    function updateCountdown() 
    {
        const now = new Date();
        let christmasYear = now.getFullYear();
        const month = now.getMonth();
        const day = now.getDate();

        if (month === 11 && day > 25) 
            christmasYear += 1;

        const christmasDate = new Date(christmasYear, 11, 25);
        const diffInMilliseconds = christmasDate.getTime() - now.getTime();
        const oneDayMilliseconds = 1000 * 60 * 60 * 24;
        const display = Math.ceil(diffInMilliseconds / oneDayMilliseconds);

        const getMessage = translations[currentLang] || translations['en'];
        
        document.getElementById("Header").textContent = getMessage(display);
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);
    const dropdown = document.getElementById('LangSelect');
    dropdown.addEventListener('change', function() {
            currentLang = this.value;
            updateCountdown();
    });
</script>
<script>
    const filePicker = document.getElementById('BgPicker');

    window.addEventListener('DOMContentLoaded', () => {
        const savedBg = localStorage.getItem('savedBackground');
        if (savedBg) 
            document.body.style.backgroundImage = `url(${savedBg})`;
    });

    filePicker.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const base64Image = e.target.result;
                document.body.style.backgroundImage = `url(${base64Image})`;
                localStorage.setItem('savedBackground', base64Image);
            };
            
            reader.readAsDataURL(file);
        }
    });    
</script>

    text-align: center;
    color: rgb(255, 255, 255);
    background: rgb(56, 56, 56);
    padding: 1px;

    font-weight: bold;
    }

    body {
    background-color: rgb(56, 56, 56);
    }

    #LangSelect {
    position: fixed;
    bottom: 20px;
    left: 105px;
    
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: bold;
    
    z-index: 1000;
    }

    #LangLabel {
    position: fixed;
    bottom: 20px;
    left: 20px;
    
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: bold;
    color: rgb(255, 255, 255);
    
    z-index: 1000;
    }

    @media (max-width: 767px) 
    {
        .LangLabel {
        font-size: 32px;
        }
    }

    /*background*/

    body {
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        height: 100vh;
        transition: background 0.1s ease-in-out;
    }

    #BgPicker {
        position: fixed;
        bottom: 20px;
        right: 20px;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        font-weight: bold;
        color: rgb(255, 255, 255);
        /*background: white;
        padding: 8px;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);*/
    }

    #PickerLabel {
        position: fixed;
        bottom: 20px;
        right: 260px;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        font-weight: bold;
        color: rgb(255, 255, 255);

        padding: 8px;

    }
</style>
</body>
</html>
